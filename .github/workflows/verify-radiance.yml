name: Verify radiance pipeline
on:
  workflow_dispatch:
  push:
    branches: [codex/v06-clay-studio]
    paths: ['studio/**', 'clay/**', 'admin/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/verify-radiance.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned Blender
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          curl --fail --location --retry 3 https://download.blender.org/release/Blender3.6/blender-3.6.23.sha256 -o "$RUNNER_TEMP/blender.sha256"
          python3 - <<'PY'
          import hashlib, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          expected=next(line.split()[0] for line in (root/'blender.sha256').read_text().splitlines() if line.endswith('blender-3.6.23-linux-x64.tar.xz'))
          assert hashlib.sha256((root/'blender.tar.xz').read_bytes()).hexdigest()==expected
          PY
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Bake a generated source scene
        run: |
          BLENDER_THREADS=4 "$RUNNER_TEMP/blender/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python tests/blender_radiance_smoke.py
      - name: Compare six actual WebGL views
        run: |
          node scripts/optimize-result.mjs .source-assets/radiance-smoke
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8846 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/validate-radiance.mjs 'http://127.0.0.1:8846/clay/lab.html?result=../.source-assets/radiance-smoke' .source-assets/radiance-smoke
          python3 - <<'PY'
          import json
          result=json.load(open('.source-assets/radiance-smoke/validation.json'))
          assert result['passed'], result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-smoke-comparison
          path: .source-assets/radiance-smoke/
          retention-days: 3
