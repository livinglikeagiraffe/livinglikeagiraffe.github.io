<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Studio · Living like a giraffe</title><link rel="icon" href="../assets/branding/favicon.svg"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script></head>
<body>
<header><strong>Studio</strong><nav><button data-view="review" class="active">파일</button><button data-view="grid">배치 <span id="placed-count">0</span></button></nav><a href="../clay/" target="_blank" rel="noopener">공개 페이지 ↗</a><button id="open-github">GitHub 연결</button><span id="connection-label">브라우저 저장</span></header>
<div class="workspace"><aside><div class="row"><strong>버전</strong><button id="new-module" aria-label="새 파일">＋</button></div><div id="version-list"></div></aside>
<main>
<div id="review-toolbar"></div>
<section id="review-panel">
<div id="upload-zone"><input id="upload-input" type="file" multiple accept=".zip,.glb,.blend,.png,.jpg,.jpeg,.webp" aria-label="파일 업로드"><button id="load-example">v06 불러오기</button></div>
<div class="row module-bar"><label>이름<input id="module-title" value="이름 없는 공간" maxlength="80"></label><label>모듈<select id="module-target"><option value="">새 모듈</option></select></label><button id="save-version" disabled>버전 저장</button><button id="add-module" disabled>배치에 추가</button></div>
<div class="compare-grid">
<section><div class="row"><select id="model-select" aria-label="GLB 모델" disabled><option>GLB</option></select><button data-preview="live" class="active">원본 GLB</button><button data-preview="baked" disabled>베이킹</button><button id="reset-camera" aria-label="처음 시점">↺</button></div><div id="viewer-host"><span id="viewer-empty">GLB</span></div><div class="row meta"><span id="model-info"></span><span id="bake-status"></span><a id="download-baked" download="baked.glb" hidden>GLB ↓</a></div></section>
<section><div class="row"><button data-image="reference" class="active">PNG</button><button data-image="render">Blender</button><select id="image-select" aria-label="참고 이미지" disabled><option>PNG</option></select></div><div id="image-host"><img id="comparison-image" alt="씬 비교 이미지" hidden><span id="image-empty">PNG</span></div><div class="row meta"><span id="image-caption"></span><a id="render-link" target="_blank" rel="noopener" hidden>로그 ↗</a></div></section>
</div>
<div class="row render-options"><label>원본<select id="blend-select"><option value="">.blend 없음</option></select></label><label>씬<input id="scene-name" placeholder="기본 씬"></label><label>품질<select id="render-quality"><option value="preview">표준</option><option value="original">정밀</option></select></label><label class="check"><input id="bake-with-render" type="checkbox" checked>간접광 베이킹</label><button id="render-button" disabled>렌더</button><span id="render-status" role="status"></span></div>
<details id="look-panel"><summary>재질·조명</summary><div class="row"><button id="source-look" disabled>원본 설정</button><button id="reset-look" disabled>초기화</button><span id="look-source"></span><span id="look-status" role="status"></span></div><fieldset id="look-controls" disabled>
<label>밝기 <output id="look-exposure-value"></output><input id="look-exposure" data-look="exposure" type="range" min="-2" max="2" step=".05"></label>
<label>주 조명 <output id="look-key-value"></output><input id="look-key" data-look="key" type="range" min="0" max="3" step=".05"></label>
<label>보조 조명 <output id="look-fill-value"></output><input id="look-fill" data-look="fill" type="range" min="0" max="3" step=".05"></label>
<label>거칠기 <output id="look-roughness-value"></output><input id="look-roughness" data-look="roughness" type="range" min=".5" max="1.5" step=".05"></label>
<label>요철 <output id="look-texture-value"></output><input id="look-texture" data-look="texture" type="range" min="0" max="2" step=".05"></label>
<label>시점<select id="look-camera" data-look="camera"><option value="authored">원본</option><option value="fit">전체</option></select></label>
</fieldset></details>
</section>
<section id="grid-panel" hidden>
<div class="row"><button id="save-grid">배치 저장·베이킹</button><button id="refresh-layout">불러오기</button><label class="check"><input id="auto-layout-bake" type="checkbox" checked>자동 베이킹</label><label>바닥<input id="layout-floor" type="color" value="#b6b0a4"></label><label>품질<select id="layout-quality"><option value="preview">표준</option><option value="original">정밀</option></select></label></div>
<div class="row"><button data-layout-view="edit" class="active">편집</button><button data-layout-view="baked" disabled>베이킹</button><button data-layout-view="render" disabled>Blender</button><a id="layout-result-download" download="whole-space.glb" hidden>GLB ↓</a><a id="layout-compare" target="_blank" rel="noopener" hidden>6시점 비교 ↗</a><button id="retry-layout" hidden>다시 베이킹</button><a id="layout-log" target="_blank" rel="noopener" hidden>로그 ↗</a><span id="layout-status" role="status"></span></div>
<div id="grid-stage"></div><img id="layout-render" alt="전체 Blender 렌더" hidden>
<div class="grid-bottom"><div><div id="cell-map" aria-label="격자 위치"></div><div class="row"><button id="rotate-cell">90° 회전</button><button id="remove-cell">제거</button><span id="selected-cell-label"></span></div></div><form id="grid-settings" class="row"><label>가로<input name="columns" type="number" min="1" max="6" value="4"></label><label>세로<input name="rows" type="number" min="1" max="6" value="3"></label><label>폭 (m)<input name="width" type="number" min="1" max="200" step=".1" value="40"></label><label>깊이 (m)<input name="depth" type="number" min="1" max="200" step=".1" value="32"></label><label>간격 (m)<input name="gap" type="number" min="0" max="20" step=".1" value="2"></label><button>적용</button></form></div>
</section>
</main></div>
<dialog id="github-dialog"><form id="github-form"><div class="row"><strong>GitHub</strong><button type="button" class="dialog-close" aria-label="닫기">×</button></div><label>저장소<input id="github-repo" placeholder="owner/repository" required autocomplete="off"></label><label>토큰<input id="github-token" type="password" required autocomplete="off"></label><small>Contents·Actions 쓰기 권한. 토큰은 이 페이지 메모리에만 보관됩니다.</small><label class="check"><input id="public-consent" type="checkbox">원본 공개 동의</label><p id="github-message" role="status"></p><div class="row"><button>연결</button><button id="disconnect" type="button">연결 해제</button><a href="./setup.html" target="_blank" rel="noopener">설정</a></div></form></dialog>
<p id="notice" role="status" aria-live="polite" hidden></p>
<script type="module" src="./app.js"></script>
</body></html>
